name: Publish PACKET ZERO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html style.css favicon.svg content.js lab-data.js network.js diagrams.js app.js _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/content.js
          test -s _site/app.js
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
